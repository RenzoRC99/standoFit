spring.application.name=standoFit

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/standofit
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=standofit
spring.datasource.password=standofit
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

