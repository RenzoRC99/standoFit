services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standofit"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: always

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.standofit.rule=Host(`standofit.saramambiche.duckdns.org`)"
      - "traefik.http.routers.standofit.entrypoints=websecure"
      - "traefik.http.routers.standofit.tls.certresolver=myresolver"
      - "traefik.http.services.standofit.loadbalancer.server.port=8080"
    restart: always

volumes:
  pgdata:

networks:
  web:
    external: true
