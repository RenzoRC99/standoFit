services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: standofit
      POSTGRES_USER: standofit
      POSTGRES_PASSWORD: standofit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standofit"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/standofit
      SPRING_DATASOURCE_USERNAME: standofit
      SPRING_DATASOURCE_PASSWORD: standofit
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
