plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
    id 'org.openapi.generator' version '7.14.0'
}

group = 'com.standofit'
version = '0.0.1-SNAPSHOT'
description = 'standoFit'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDir 'build/generated/src/main/java'
            exclude 'org/openapitools/**'
        }
    }
}

compileJava.dependsOn 'openApiGenerate', 'openApiGeneratePlanning'
compileJava.dependsOn 'spotlessApply'

compileJava.mustRunAfter 'openApiGenerate', 'openApiGeneratePlanning'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.22'
    implementation 'io.swagger.core.v3:swagger-core:2.2.22'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'api.version', '1.45'
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude '**/api/execution/ApiApi.java'
        targetExclude 'build/generated/**'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

openApiGenerate {
    inputSpec = "$projectDir/docs/openapi-execution.yaml".toString()
    outputDir = "$projectDir/build/generated".toString()
    generatorName = "spring"
    apiPackage = "com.standofit.back.api.execution"
    modelPackage = "com.standofit.back.api.execution.dto"
    invokerPackage = "com.standofit.back.clients.execution"
    configOptions = [
        useSpringBoot3: "true",
        interfaceOnly: "true",
        interfaceName: "ExecutionApi"
    ]
}

task openApiGeneratePlanning(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    inputSpec = "$projectDir/docs/openapi-planning.yaml".toString()
    outputDir = "$projectDir/build/generated".toString()
    generatorName = "spring"
    apiPackage = "com.standofit.back.api.planning"
    modelPackage = "com.standofit.back.api.planning.dto"
    invokerPackage = "com.standofit.back.clients.planning"
    configOptions = [
        useSpringBoot3: "true",
        interfaceOnly: "true",
        interfaceName: "PlanningApi"
    ]
}

compileJava {
    doFirst {
        def execApiSource = new File('build/generated/src/main/java/com/standofit/back/api/execution/ApiApi.java')
        if (execApiSource.exists()) {
            def execApi = new File('build/generated/src/main/java/com/standofit/back/api/execution/ApiApi.java')
            execApi.write(execApi.text.replace('interface ApiApi', 'interface ExecutionApi'))
            execApi.renameTo(new File('build/generated/src/main/java/com/standofit/back/api/execution/ExecutionApi.java'))
        }
        
        def planApiSource = new File('build/generated/src/main/java/com/standofit/back/api/planning/ApiApi.java')
        if (planApiSource.exists()) {
            def planApi = new File('build/generated/src/main/java/com/standofit/back/api/planning/ApiApi.java')
            planApi.write(planApi.text.replace('interface ApiApi', 'interface PlanningApi'))
            planApi.renameTo(new File('build/generated/src/main/java/com/standofit/back/api/planning/PlanningApi.java'))
        }
    }
}

afterEvaluate {
    tasks.named('spotlessCheck') {
        dependsOn 'openApiGenerate', 'openApiGeneratePlanning'
        mustRunAfter 'openApiGenerate', 'openApiGeneratePlanning'
    }
    tasks.named('spotlessJavaCheck') {
        dependsOn 'openApiGenerate', 'openApiGeneratePlanning'
        mustRunAfter 'openApiGenerate', 'openApiGeneratePlanning'
    }
    tasks.named('spotlessJava') {
        dependsOn 'openApiGenerate', 'openApiGeneratePlanning'
        mustRunAfter 'openApiGenerate', 'openApiGeneratePlanning'
    }
}
