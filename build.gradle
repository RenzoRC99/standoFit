plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
    id 'org.openapi.generator' version '7.10.0'
}

group = 'com.standofit'
version = '0.0.1-SNAPSHOT'
description = 'standoFit'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude '**/api/execution/ApiApi.java'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

openApiGenerate {
    inputSpec = "$projectDir/docs/openapi-execution.yaml".toString()
    outputDir = "$projectDir/build/generated".toString()
    generatorName = "spring"
    apiPackage = "com.standofit.back.api.execution"
    modelPackage = "com.standofit.back.api.execution.dto"
    invokerPackage = "com.standofit.back.api.execution"
}

task openApiGeneratePlanning(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    inputSpec = "$projectDir/docs/openapi-planning.yaml".toString()
    outputDir = "$projectDir/build/generated".toString()
    generatorName = "spring"
    apiPackage = "com.standofit.back.api.planning"
    modelPackage = "com.standofit.back.api.planning.dto"
    invokerPackage = "com.standofit.back.api.planning"
}

tasks.register('fixApiImports') {
    dependsOn 'openApiGenerate', 'openApiGeneratePlanning'
    doLast {
        // Fix and copy execution API
        def srcExec = file("build/generated/src/main/java/com/standofit/back/api/execution/ApiApi.java")
        if (srcExec.exists()) {
            def contentExec = srcExec.text
            contentExec = contentExec.replace('javax.validation', 'jakarta.validation')
            contentExec = contentExec.replace('javax.annotation', 'jakarta.annotation')
            contentExec = contentExec.replace('javax.servlet', 'jakarta.servlet')
            def destExec = file("src/main/java/com/standofit/back/api/execution/ApiApi.java")
            destExec.write(contentExec)
        }

        // Fix and copy planning API
        def srcPlanning = file("build/generated/src/main/java/com/standofit/back/api/planning/ApiApi.java")
        if (srcPlanning.exists()) {
            def contentPlanning = srcPlanning.text
            contentPlanning = contentPlanning.replace('javax.validation', 'jakarta.validation')
            contentPlanning = contentPlanning.replace('javax.annotation', 'jakarta.annotation')
            contentPlanning = contentPlanning.replace('javax.servlet', 'jakarta.servlet')
            contentPlanning = contentPlanning.replaceAll('@Validated', '')
            def destPlanning = file("src/main/java/com/standofit/back/api/planning/ApiApi.java")
            destPlanning.write(contentPlanning)
        }

        // Copy and fix ApiUtil for both packages
        ['execution', 'planning'].each { pkg ->
            def srcUtil = file("build/generated/src/main/java/com/standofit/back/api/${pkg}/ApiUtil.java")
            if (srcUtil.exists()) {
                def contentUtil = srcUtil.text
                contentUtil = contentUtil.replace('javax.validation', 'jakarta.validation')
                contentUtil = contentUtil.replace('javax.annotation', 'jakarta.annotation')
                contentUtil = contentUtil.replace('javax.servlet', 'jakarta.servlet')
                def destUtil = file("src/main/java/com/standofit/back/api/${pkg}/ApiUtil.java")
                destUtil.write(contentUtil)
            }
        }

        // Copy and fix DTOs for planning
        def dtoSrcDir = file("build/generated/src/main/java/com/standofit/back/api/planning/dto")
        def dtoDestDir = file("src/main/java/com/standofit/back/api/planning/dto")
        if (dtoSrcDir.exists()) {
            dtoDestDir.mkdirs()
            dtoSrcDir.eachFile { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    content = content.replace('javax.validation', 'jakarta.validation')
                    content = content.replace('javax.annotation', 'jakarta.annotation')
                    content = content.replace('javax.servlet', 'jakarta.servlet')
                    new File(dtoDestDir, f.name).write(content)
                }
            }
        }
    }
}

compileJava {
    dependsOn fixApiImports
}
