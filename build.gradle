plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
    id 'org.openapi.generator' version '7.10.0'
}

group = 'com.standofit'
version = '0.0.1-SNAPSHOT'
description = 'standoFit'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude '**/api/execution/ApiApi.java'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

openApiGenerate {
    inputSpec = "$projectDir/docs/openapi-execution.yaml".toString()
    outputDir = "$projectDir/build/generated".toString()
    generatorName = "spring"
    apiPackage = "com.standofit.back.api.execution"
    modelPackage = "com.standofit.back.api.execution.dto"
    invokerPackage = "com.standofit.back.api.execution"
}

tasks.register('fixApiImports', Exec) {
    dependsOn 'openApiGenerate'
    workingDir '.'
    commandLine 'echo', 'copying ApiApi...'
    doLast {
        def src = file("build/generated/src/main/java/com/standofit/back/api/execution/ApiApi.java")
        def content = src.text
        content = content.replace('javax.validation', 'jakarta.validation')
        content = content.replace('javax.annotation', 'jakarta.annotation')
        def dest = file("src/main/java/com/standofit/back/api/execution/ApiApi.java")
        dest.write(content)
    }
}

compileJava {
    dependsOn fixApiImports
}
